apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmacy-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pharmacy-api
  template:
    metadata:
      labels:
        app: pharmacy-api
    spec:
      containers:
        - name: pharmacy-api
          image: pharmacy-api:5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PHARMACY_SEED_DEMO
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pharmacy-api
spec:
  type: ClusterIP
  selector:
    app: pharmacy-api
  ports:
    - port: 8000
      targetPort: 8000

