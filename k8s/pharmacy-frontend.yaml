apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmacy-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pharmacy-frontend
  template:
    metadata:
      labels:
        app: pharmacy-frontend
    spec:
      containers:
        - name: pharmacy-frontend
          image: pharmacy-frontend:5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 8
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pharmacy-frontend
spec:
  type: ClusterIP
  selector:
    app: pharmacy-frontend
  ports:
    - port: 80
      targetPort: 80

